name: TidalSurger
version: '1.0.0'
main: com.tidalsurger.TidalSurgerPlugin
api-version: '1.21'
authors: [ TidalSurger ]
description: A netherite sword wearing the legendary ocean trident's skin, with the Tidal Surf and Tidal Core abilities.
website: https://papermc.io

commands:
  tidalsurger:
    description: Utility and admin commands for the Tidal Surger plugin.
    usage: |
      /tidalsurger give [player] - receive the Tidal Surger
      /tidalsurger info - show ability status and cooldowns
      /tidalsurger cooldown [player] - clear ability cooldowns (own, or another player's)
      /tidalsurger cubes - list the active water cubes
      /tidalsurger reload - reload config.yml
    aliases: [ ts, tidalsurge ]

permissions:
  tidalsurger.use:
    description: Base permission required to activate any Tidal Surger ability.
    default: true
  tidalsurger.ability.surf:
    description: Allows activating Tidal Surf (offhand key F).
    default: true
  tidalsurger.ability.core:
    description: Allows activating Tidal Core (Shift + offhand key F).
    default: true
  tidalsurger.bypass.cooldown:
    description: Ignores Tidal Surger cooldowns. Granted explicitly; cooldowns apply to everyone by default, operators included.
    default: false
  tidalsurger.bypass.trap:
    description: Cannot be trapped inside a Tidal Core water cube. Granted explicitly; everyone can be trapped by default.
    default: false
  tidalsurger.command.give:
    description: Allows using /tidalsurger give.
    default: op
  tidalsurger.command.cooldown:
    description: Allows using /tidalsurger cooldown to clear ability cooldowns.
    default: op
  tidalsurger.command.reload:
    description: Allows using /tidalsurger reload.
    default: op
  tidalsurger.command.debug:
    description: Allows using /tidalsurger cubes.
    default: op
  tidalsurger.*:
    description: Grants every Tidal Surger permission (the two bypass nodes are deliberately not included).
    default: op
    children:
      tidalsurger.use: true
      tidalsurger.ability.surf: true
      tidalsurger.ability.core: true
      tidalsurger.command.give: true
      tidalsurger.command.cooldown: true
      tidalsurger.command.reload: true
      tidalsurger.command.debug: true
